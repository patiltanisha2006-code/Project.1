<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SumerClock | Booking Hotels With us</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/animations.min.css">
</head>

<body>

    <header class="header" id="header">
        <nav class="navbar">
            <a href="#" class="logo-link">
                Sumer<span>Clock</span>
            </a>
            <div class="navigation">
                <a href="#Home" class="link"> Home &nbsp </a>
                <a href="#About" class="link"> About &nbsp </a>
                <a href="#Services" class="link"> Services &nbsp </a>
                <a href="#News" class="link"> News &nbsp </a>
                <a href="#Contact" class="link"> Contact &nbsp </a>
            </div>
            <div class="controls">
                <span class="icon"><i class="bxr bx-user"></span>
                <span class="icon"><i class="bxrf bx-search"></span>
                <span class="icon menu" id="menu"><i class="bxrf bx-search"></span>
            </div>
        </nav>
    </header>


    <section class="home" id="home">
        <div class="container">
            <div class="iteam">
                <div class="item">
                    <div class="content"><br>
                        <h1 class="title"><br>
                           <br> Booking A Luxury Hotel <br>
                            In One Munite
                        </h1>
                        <div class="desc">
                            <p>
                               <br> We have contact with the best 2.2k Luxury Hotels in All the word
                            </p>
                        </div>
                        <div class="buttons">
                            <button>Discover now</button>
                        </div>
                    </div>

                </div>
                <div class="item">
                    <div class="box">
                        <h1 class="title"><bold><i>Booking Your Hotel</i></bold></h1>

                        <form action=class="form">
                            <div class="line">
                                <label for="">Check in:<br></label>
                                <input type="date" name="in" id="in">
                            </div>
                            <div class="line">
                                <label for="">Check out:<br></label>
                                <input type="date" name="out" id="out">
                            </div>

                            <div class="line">
                                <label for="">Guests:<br></label>
                                <select name="guests" id="Guests">
                                    <option value="1">1 Adult</option>
                                    <option value="2">2 Adults</option>
                                    <option value="3">2 Adults + 1 kid</option>
                                    <option value="4">2 Adults + 2 kids</option>
                                    <option value="5">4 Adults + 2 kids</option>
                                    <option value="6">4 Adults + 3 kids</option>
                                    <option value="7">4 Adults + 4 kids</option>
                                </select>
                            </div>
                            <div class="line">
                                <label for="">Guests:<br></label>
                                <select name="guests" id="Guests">
                                    <option value="1">1 Room</option>
                                    <option value="2">2 Rooms</option>
                                    <option value="3">3 Rooms</option>
                                    <option value="4">4 Rooms</option>
                                    <option value="5">1 Room + 1 kids Room</option>
                                    <option value="6">2 Room + 1 kidsRooms</option>
                                    <option value="7">1 Room + 2 kidsRooms</option>
                                </select>
                            </div>
                            <div class="line">
                                <button class="btn">Check Aviability</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
